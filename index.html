<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Together - YouTube Sync</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        .search-result:hover { background: rgba(102, 126, 234, 0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Lucide React Icons (simplified inline versions)
        const Users = ({ style }) => (
            <svg style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
        );

        const Play = ({ style }) => (
            <svg style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const Pause = ({ style }) => (
            <svg style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const Copy = ({ style }) => (
            <svg style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
        );

        const Check = ({ style }) => (
            <svg style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
            </svg>
        );

        const Search = ({ style }) => (
            <svg style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );

        const Link = ({ style }) => (
            <svg style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
            </svg>
        );

        // Mock storage API for standalone HTML (uses localStorage)
        window.storage = {
            async get(key, shared) {
                const value = localStorage.getItem(key);
                return value ? { key, value, shared } : null;
            },
            async set(key, value, shared) {
                localStorage.setItem(key, value);
                return { key, value, shared };
            },
            async delete(key, shared) {
                localStorage.removeItem(key);
                return { key, deleted: true, shared };
            },
            async list(prefix, shared) {
                const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
                return { keys, prefix, shared };
            }
        };

        function WatchTogether() {
            const [roomId, setRoomId] = useState('');
            const [videoUrl, setVideoUrl] = useState('');
            const [videoId, setVideoId] = useState('');
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [isHost, setIsHost] = useState(false);
            const [copied, setCopied] = useState(false);
            const [joinInput, setJoinInput] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [isSearching, setIsSearching] = useState(false);
            const [inputMode, setInputMode] = useState('search'); // 'search' or 'url'
            const playerRef = useRef(null);
            const syncIntervalRef = useRef(null);

            const extractVideoId = (url) => {
                const patterns = [
                    /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/,
                    /youtube\.com\/embed\/([^&\n?#]+)/
                ];
                
                for (const pattern of patterns) {
                    const match = url.match(pattern);
                    if (match) return match[1];
                }
                return null;
            };

            const createRoom = () => {
                const newRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
                setRoomId(newRoomId);
                setIsHost(true);
                initializeStorage(newRoomId);
            };

            const joinRoom = (id) => {
                const cleanId = id.trim().toUpperCase();
                if (cleanId) {
                    setRoomId(cleanId);
                    setIsHost(false);
                    loadRoomState(cleanId);
                }
            };

            const initializeStorage = async (roomId) => {
                try {
                    const roomData = {
                        videoId: '',
                        isPlaying: false,
                        currentTime: 0,
                        lastUpdate: Date.now()
                    };
                    await window.storage.set(`room_${roomId}`, JSON.stringify(roomData), true);
                } catch (error) {
                    console.error('Storage error:', error);
                }
            };

            const loadRoomState = async (roomId) => {
                try {
                    const result = await window.storage.get(`room_${roomId}`, true);
                    if (result) {
                        const data = JSON.parse(result.value);
                        if (data.videoId) {
                            setVideoId(data.videoId);
                            setIsPlaying(data.isPlaying);
                            setCurrentTime(data.currentTime);
                        }
                    }
                } catch (error) {
                    console.error('Error loading room:', error);
                }
            };

            const updateRoomState = async (updates) => {
                if (!roomId) return;
                
                try {
                    const result = await window.storage.get(`room_${roomId}`, true);
                    const currentData = result ? JSON.parse(result.value) : {};
                    
                    const newData = {
                        ...currentData,
                        ...updates,
                        lastUpdate: Date.now()
                    };
                    
                    await window.storage.set(`room_${roomId}`, JSON.stringify(newData), true);
                } catch (error) {
                    console.error('Error updating room:', error);
                }
            };

            const searchVideos = async () => {
                if (!searchQuery.trim()) return;
                
                setIsSearching(true);
                try {
                    // Using a public API to search YouTube videos
                    const response = await fetch(
                        `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=6&q=${encodeURIComponent(searchQuery)}&type=video&key=AIzaSyDKpXLRoW8Cv0xPbSjPZGr5T_EH6HpqRQU`
                    );
                    const data = await response.json();
                    
                    if (data.items) {
                        setSearchResults(data.items);
                    }
                } catch (error) {
                    console.error('Search error:', error);
                    alert('Search failed. Please try pasting a URL instead.');
                } finally {
                    setIsSearching(false);
                }
            };

            const selectVideo = (video) => {
                const id = video.id.videoId;
                setVideoId(id);
                setCurrentTime(0);
                setIsPlaying(false);
                setSearchResults([]);
                setSearchQuery('');
                if (isHost) {
                    updateRoomState({ videoId: id, currentTime: 0, isPlaying: false });
                }
            };

            const loadVideo = () => {
                const id = extractVideoId(videoUrl);
                if (id) {
                    setVideoId(id);
                    setCurrentTime(0);
                    setIsPlaying(false);
                    if (isHost) {
                        updateRoomState({ videoId: id, currentTime: 0, isPlaying: false });
                    }
                }
            };

            useEffect(() => {
                if (!roomId || !videoId) return;

                const syncState = async () => {
                    try {
                        const result = await window.storage.get(`room_${roomId}`, true);
                        if (result) {
                            const data = JSON.parse(result.value);
                            
                            if (!isHost) {
                                if (data.videoId !== videoId) {
                                    setVideoId(data.videoId);
                                }
                                if (Math.abs(data.currentTime - currentTime) > 2) {
                                    setCurrentTime(data.currentTime);
                                }
                                if (data.isPlaying !== isPlaying) {
                                    setIsPlaying(data.isPlaying);
                                }
                            }
                        }
                    } catch (error) {
                        console.error('Sync error:', error);
                    }
                };

                syncIntervalRef.current = setInterval(syncState, 1000);
                return () => clearInterval(syncIntervalRef.current);
            }, [roomId, videoId, isHost, currentTime, isPlaying]);

            const togglePlayback = () => {
                const newState = !isPlaying;
                setIsPlaying(newState);
                if (isHost) {
                    updateRoomState({ isPlaying: newState, currentTime });
                }
            };

            useEffect(() => {
                if (!isPlaying) return;
                
                const interval = setInterval(() => {
                    setCurrentTime(t => {
                        const newTime = t + 1;
                        if (isHost) {
                            updateRoomState({ currentTime: newTime });
                        }
                        return newTime;
                    });
                }, 1000);
                
                return () => clearInterval(interval);
            }, [isPlaying, isHost, roomId]);

            const copyRoomLink = () => {
                navigator.clipboard.writeText(roomId);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            if (!roomId) {
                return (
                    <div style={{
                        minHeight: '100vh',
                        background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        padding: '20px'
                    }}>
                        <div style={{
                            background: 'rgba(255, 255, 255, 0.95)',
                            borderRadius: '20px',
                            padding: '40px',
                            maxWidth: '450px',
                            width: '100%',
                            boxShadow: '0 20px 60px rgba(0, 0, 0, 0.3)'
                        }}>
                            <div style={{ textAlign: 'center', marginBottom: '30px' }}>
                                <Users style={{ width: '60px', height: '60px', color: '#667eea', margin: '0 auto 20px' }} />
                                <h1 style={{ fontSize: '32px', fontWeight: 'bold', color: '#1a202c', marginBottom: '10px' }}>
                                    Watch Together
                                </h1>
                                <p style={{ color: '#4a5568', fontSize: '16px' }}>
                                    Watch YouTube videos in sync with friends
                                </p>
                            </div>
                            
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '15px' }}>
                                <button
                                    onClick={createRoom}
                                    style={{
                                        width: '100%',
                                        background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                        color: 'white',
                                        fontWeight: '600',
                                        padding: '15px 24px',
                                        borderRadius: '12px',
                                        border: 'none',
                                        cursor: 'pointer',
                                        fontSize: '16px',
                                        transition: 'transform 0.2s',
                                        boxShadow: '0 4px 15px rgba(102, 126, 234, 0.4)'
                                    }}
                                    onMouseOver={(e) => e.target.style.transform = 'scale(1.02)'}
                                    onMouseOut={(e) => e.target.style.transform = 'scale(1)'}
                                >
                                    Create New Room
                                </button>
                                
                                <div style={{ position: 'relative', textAlign: 'center', margin: '10px 0' }}>
                                    <div style={{ 
                                        position: 'absolute', 
                                        top: '50%', 
                                        left: 0, 
                                        right: 0, 
                                        height: '1px', 
                                        background: '#e2e8f0' 
                                    }}></div>
                                    <span style={{ 
                                        position: 'relative', 
                                        background: 'rgba(255, 255, 255, 0.95)', 
                                        padding: '0 15px', 
                                        color: '#718096',
                                        fontSize: '14px'
                                    }}>
                                        or
                                    </span>
                                </div>
                                
                                <div style={{ display: 'flex', gap: '10px' }}>
                                    <input
                                        type="text"
                                        placeholder="Enter Room ID"
                                        value={joinInput}
                                        onChange={(e) => setJoinInput(e.target.value)}
                                        onKeyPress={(e) => {
                                            if (e.key === 'Enter' && joinInput) {
                                                joinRoom(joinInput);
                                            }
                                        }}
                                        style={{
                                            flex: 1,
                                            background: 'white',
                                            border: '2px solid #e2e8f0',
                                            borderRadius: '12px',
                                            padding: '12px 16px',
                                            fontSize: '16px',
                                            outline: 'none'
                                        }}
                                        onFocus={(e) => e.target.style.borderColor = '#667eea'}
                                        onBlur={(e) => e.target.style.borderColor = '#e2e8f0'}
                                    />
                                    <button
                                        onClick={() => joinRoom(joinInput)}
                                        style={{
                                            background: '#48bb78',
                                            color: 'white',
                                            fontWeight: '600',
                                            padding: '12px 24px',
                                            borderRadius: '12px',
                                            border: 'none',
                                            cursor: 'pointer',
                                            fontSize: '16px'
                                        }}
                                    >
                                        Join
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div style={{
                    minHeight: '100vh',
                    background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                    padding: '20px'
                }}>
                    <div style={{ maxWidth: '1200px', margin: '0 auto' }}>
                        <div style={{
                            background: 'rgba(255, 255, 255, 0.95)',
                            borderRadius: '15px',
                            padding: '20px',
                            marginBottom: '20px',
                            boxShadow: '0 4px 15px rgba(0, 0, 0, 0.1)'
                        }}>
                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '15px' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                                    <Users style={{ width: '28px', height: '28px', color: '#667eea' }} />
                                    <div>
                                        <div style={{ fontWeight: '600', fontSize: '18px', color: '#1a202c' }}>
                                            Room: {roomId}
                                        </div>
                                        <div style={{ color: '#718096', fontSize: '14px' }}>
                                            {isHost ? '👑 Host' : '👤 Viewer'}
                                        </div>
                                    </div>
                                </div>
                                <button
                                    onClick={copyRoomLink}
                                    style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '8px',
                                        background: '#667eea',
                                        color: 'white',
                                        padding: '10px 20px',
                                        borderRadius: '10px',
                                        border: 'none',
                                        cursor: 'pointer',
                                        fontWeight: '600',
                                        fontSize: '14px'
                                    }}
                                >
                                    {copied ? (
                                        <>
                                            <Check style={{ width: '16px', height: '16px' }} />
                                            Copied!
                                        </>
                                    ) : (
                                        <>
                                            <Copy style={{ width: '16px', height: '16px' }} />
                                            Copy Room ID
                                        </>
                                    )}
                                </button>
                            </div>
                        </div>

                        {isHost && (
                            <div style={{
                                background: 'rgba(255, 255, 255, 0.95)',
                                borderRadius: '15px',
                                padding: '20px',
                                marginBottom: '20px',
                                boxShadow: '0 4px 15px rgba(0, 0, 0, 0.1)'
                            }}>
                                {/* Toggle between search and URL */}
                                <div style={{ display: 'flex', gap: '10px', marginBottom: '15px' }}>
                                    <button
                                        onClick={() => setInputMode('search')}
                                        style={{
                                            flex: 1,
                                            background: inputMode === 'search' ? '#667eea' : '#e2e8f0',
                                            color: inputMode === 'search' ? 'white' : '#4a5568',
                                            padding: '10px',
                                            borderRadius: '8px',
                                            border: 'none',
                                            cursor: 'pointer',
                                            fontWeight: '600',
                                            fontSize: '14px',
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            gap: '8px'
                                        }}
                                    >
                                        <Search style={{ width: '16px', height: '16px' }} />
                                        Search Videos
                                    </button>
                                    <button
                                        onClick={() => setInputMode('url')}
                                        style={{
                                            flex: 1,
                                            background: inputMode === 'url' ? '#667eea' : '#e2e8f0',
                                            color: inputMode === 'url' ? 'white' : '#4a5568',
                                            padding: '10px',
                                            borderRadius: '8px',
                                            border: 'none',
                                            cursor: 'pointer',
                                            fontWeight: '600',
                                            fontSize: '14px',
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            gap: '8px'
                                        }}
                                    >
                                        <Link style={{ width: '16px', height: '16px' }} />
                                        Paste URL
                                    </button>
                                </div>

                                {inputMode === 'search' ? (
                                    <div>
                                        <div style={{ display: 'flex', gap: '10px', marginBottom: '15px' }}>
                                            <input
                                                type="text"
                                                placeholder="Search for videos..."
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                                onKeyPress={(e) => {
                                                    if (e.key === 'Enter') searchVideos();
                                                }}
                                                style={{
                                                    flex: 1,
                                                    background: 'white',
                                                    border: '2px solid #e2e8f0',
                                                    borderRadius: '10px',
                                                    padding: '12px 16px',
                                                    fontSize: '16px',
                                                    outline: 'none'
                                                }}
                                            />
                                            <button
                                                onClick={searchVideos}
                                                disabled={isSearching}
                                                style={{
                                                    background: '#667eea',
                                                    color: 'white',
                                                    padding: '12px 24px',
                                                    borderRadius: '10px',
                                                    border: 'none',
                                                    cursor: isSearching ? 'wait' : 'pointer',
                                                    fontWeight: '600',
                                                    fontSize: '16px',
                                                    opacity: isSearching ? 0.7 : 1
                                                }}
                                            >
                                                {isSearching ? 'Searching...' : 'Search'}
                                            </button>
                                        </div>

                                        {searchResults.length > 0 && (
                                            <div style={{ maxHeight: '400px', overflowY: 'auto' }}>
                                                {searchResults.map((video) => (
                                                    <div
                                                        key={video.id.videoId}
                                                        className="search-result"
                                                        onClick={() => selectVideo(video)}
                                                        style={{
                                                            display: 'flex',
                                                            gap: '12px',
                                                            padding: '12px',
                                                            borderRadius: '8px',
                                                            cursor: 'pointer',
                                                            marginBottom: '8px',
                                                            transition: 'background 0.2s'
                                                        }}
                                                    >
                                                        <img
                                                            src={video.snippet.thumbnails.default.url}
                                                            alt={video.snippet.title}
                                                            style={{
                                                                width: '120px',
                                                                height: '90px',
                                                                objectFit: 'cover',
                                                                borderRadius: '6px'
                                                            }}
                                                        />
                                                        <div style={{ flex: 1 }}>
                                                            <div style={{
                                                                fontWeight: '600',
                                                                color: '#1a202c',
                                                                marginBottom: '4px',
                                                                fontSize: '14px'
                                                            }}>
                                                                {video.snippet.title}
                                                            </div>
                                                            <div style={{
                                                                color: '#718096',
                                                                fontSize: '12px'
                                                            }}>
                                                                {video.snippet.channelTitle}
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div style={{ display: 'flex', gap: '10px' }}>
                                        <input
                                            type="text"
                                            placeholder="Paste YouTube URL here..."
                                            value={videoUrl}
                                            onChange={(e) => setVideoUrl(e.target.value)}
                                            onKeyPress={(e) => {
                                                if (e.key === 'Enter') loadVideo();
                                            }}
                                            style={{
                                                flex: 1,
                                                background: 'white',
                                                border: '2px solid #e2e8f0',
                                                borderRadius: '10px',
                                                padding: '12px 16px',
                                                fontSize: '16px',
                                                outline: 'none'
                                            }}
                                        />
                                        <button
                                            onClick={loadVideo}
                                            style={{
                                                background: '#667eea',
                                                color: 'white',
                                                padding: '12px 24px',
                                                borderRadius: '10px',
                                                border: 'none',
                                                cursor: 'pointer',
                                                fontWeight: '600',
                                                fontSize: '16px'
                                            }}
                                        >
                                            Load Video
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        <div style={{
                            background: 'rgba(255, 255, 255, 0.95)',
                            borderRadius: '15px',
                            overflow: 'hidden',
                            boxShadow: '0 10px 40px rgba(0, 0, 0, 0.2)'
                        }}>
                            {videoId ? (
                                <div style={{ position: 'relative', paddingBottom: '56.25%', height: 0, background: '#000' }}>
                                    <iframe
                                        ref={playerRef}
                                        style={{
                                            position: 'absolute',
                                            top: 0,
                                            left: 0,
                                            width: '100%',
                                            height: '100%'
                                        }}
                                        src={`https://www.youtube.com/embed/${videoId}?start=${Math.floor(currentTime)}&autoplay=${isPlaying ? 1 : 0}`}
                                        title="YouTube video player"
                                        frameBorder="0"
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                        allowFullScreen
                                    ></iframe>
                                </div>
                            ) : (
                                <div style={{
                                    position: 'relative',
                                    paddingBottom: '56.25%',
                                    height: 0,
                                    background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'
                                }}>
                                    <div style={{
                                        position: 'absolute',
                                        top: '50%',
                                        left: '50%',
                                        transform: 'translate(-50%, -50%)',
                                        textAlign: 'center',
                                        color: 'white'
                                    }}>
                                        <Play style={{ width: '64px', height: '64px', margin: '0 auto 20px', opacity: 0.8 }} />
                                        <p style={{ fontSize: '18px', fontWeight: '500' }}>
                                            {isHost ? 'Search for a video or paste a URL above' : 'Waiting for host to load a video...'}
                                        </p>
                                    </div>
                                </div>
                            )}

                            {videoId && isHost && (
                                <div style={{
                                    padding: '20px',
                                    background: 'rgba(0, 0, 0, 0.05)',
                                    borderTop: '1px solid rgba(0, 0, 0, 0.1)'
                                }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                                        <button
                                            onClick={togglePlayback}
                                            style={{
                                                background: '#667eea',
                                                color: 'white',
                                                padding: '12px',
                                                borderRadius: '50%',
                                                border: 'none',
                                                cursor: 'pointer',
                                                display: 'flex',
                                                alignItems: 'center',
                                                justifyContent: 'center',
                                                boxShadow: '0 4px 10px rgba(102, 126, 234, 0.4)'
                                            }}
                                        >
                                            {isPlaying ? (
                                                <Pause style={{ width: '20px', height: '20px' }} />
                                            ) : (
                                                <Play style={{ width: '20px', height: '20px' }} />
                                            )}
                                        </button>
                                        <div style={{ fontFamily: 'monospace', fontSize: '18px', fontWeight: '600', color: '#1a202c' }}>
                                            {formatTime(currentTime)}
                                        </div>
                                        <div style={{ flex: 1, color: '#718096', fontSize: '14px' }}>
                                            {isPlaying ? '▶ Playing' : '⏸ Paused'}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div style={{ marginTop: '20px', textAlign: 'center', color: 'white', fontSize: '14px' }}>
                            💡 Share the Room ID with friends to watch together!
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<WatchTogether />, document.getElementById('root'));
    </script>
</body>
</html>
